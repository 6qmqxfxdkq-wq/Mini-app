<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой первый Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px; 
            background: var(--tg-theme-bg-color); 
            color: var(--tg-theme-text-color); 
        }
        h1 { font-size: 28px; }
        button { 
            padding: 15px 30px; 
            font-size: 18px; 
            margin: 20px;
            background: var(--tg-theme-button-color); 
            color: var(--tg-theme-button-text-color); 
            border: none; 
            border-radius: 12px; 
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Привет, Матвей! 👋</h1>
    <p>Это твой первый Telegram Mini App.</p>
    <p>Твой ID в Telegram: <span id="user-id">загрузка...</span></p>
    <button onclick="Telegram.WebApp.close()">Закрыть приложение</button>

    <script>
        Telegram.WebApp.ready();

        const user = Telegram.WebApp.initDataUnsafe.user;
        if (user) {
            document.getElementById('user-id').textContent = user.id;
        } else {
            document.getElementById('user-id').textContent = 'неизвестно (тест вне Telegram)';
        }

        // Нижняя кнопка "Готово"
        Telegram.WebApp.MainButton.setText('Готово!');
        Telegram.WebApp.MainButton.show();
        Telegram.WebApp.MainButton.onClick(() => Telegram.WebApp.close());
    </script>
</body>
</html>
